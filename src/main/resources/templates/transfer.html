<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Transferir — FinanceApp</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<nav class="navbar">
    <a class="navbar-brand" th:href="@{/dashboard}">💸 FinanceApp</a>
    <div class="navbar-links">
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/transactions}">Histórico</a>
        <form th:action="@{/logout}" method="post">
            <button type="submit">Sair</button>
        </form>
    </div>
</nav>

<div class="container">
    <div class="card">
        <div class="card-title">💸 Nova Transferência</div>

        <div th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}"
             class="alert alert-danger" th:text="${err}"></div>

        <form th:action="@{/transfer}" th:object="${transferRequest}" method="post">
            <div class="form-group">
                <label for="toCpf">CPF do destinatário (somente números)</label>
                <input type="text" id="toCpf" th:field="*{toCpf}"
                       placeholder="98765432100" maxlength="11" required/>
                <span th:if="${#fields.hasErrors('toCpf')}" th:errors="*{toCpf}" class="error-msg"></span>
            </div>
            <div class="form-group">
                <label for="amount">Valor (R$)</label>
                <input type="number" id="amount" th:field="*{amount}"
                       placeholder="0.00" min="0.01" step="0.01" required/>
                <span th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}" class="error-msg"></span>
            </div>
            <div class="form-group">
                <label for="description">Descrição (opcional)</label>
                <input type="text" id="description" th:field="*{description}"
                       placeholder="Ex: pagamento aluguel"/>
            </div>
            <div class="form-group">
                <label for="password">Sua senha</label>
                <input type="password" id="password" th:field="*{password}"
                       placeholder="Digite sua senha para confirmar" required/>
                <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error-msg"></span>
            </div>
            <div class="btn-row">
                <button type="submit" class="btn btn-success">Confirmar Transferência</button>
                <a th:href="@{/dashboard}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
